name: Feature request
description: Propose an improvement to the motion-path workflow
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: workflow
    attributes:
      label: Workflow
      description: What are you trying to achieve in Blender?
    validations:
      required: true
  - type: textarea
    id: friction
    attributes:
      label: Current friction
      description: What is slow, ambiguous or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed interaction
      description: Describe the gesture/UI rather than only the final feature.
    validations:
      required: true
  - type: textarea
    id: precedent
    attributes:
      label: Similar Blender behavior
      description: Is there an existing Blender tool or convention this could follow?
  - type: textarea
    id: tradeoffs
    attributes:
      label: Tradeoffs / edge cases
